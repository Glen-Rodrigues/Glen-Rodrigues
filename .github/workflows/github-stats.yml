name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:           # lets you run it manually too
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: Glen-Rodrigues
          output_filename: github-stats.svg
          bg_color: "EEF2FF"
          title_color: "5C6BC0"
          icon_color: "7E9CD8"
          text_color: "3D3D3D"
          border_color: "C5CAE9"
          border_radius: "12"
          count_private: "true"
          show_icons: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: Glen-Rodrigues
          output_filename: github-langs.svg
          card_type: top-langs
          layout: compact
          bg_color: "EEF2FF"
          title_color: "5C6BC0"
          text_color: "3D3D3D"
          border_color: "C5CAE9"
          border_radius: "12"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-langs.svg
          git diff --cached --quiet || git commit -m "chore: update github stats svgs"
          git push
