name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3am UTC
  workflow_dispatch:        # run manually anytime
  push:
    paths:
      - ".github/workflows/github-stats.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Stats Card
        run: |
          curl -o github-stats.svg \
            "https://github-readme-stats.vercel.app/api?username=Glen-Rodrigues&show_icons=true&bg_color=EEF2FF&title_color=5C6BC0&icon_color=7E9CD8&text_color=3D3D3D&border_color=C5CAE9&border_radius=12&count_private=true&hide_border=false"

      - name: Fetch Top Languages Card
        run: |
          curl -o github-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Glen-Rodrigues&layout=compact&bg_color=EEF2FF&title_color=5C6BC0&text_color=3D3D3D&border_color=C5CAE9&border_radius=12&hide_border=false"

      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-langs.svg
          git diff --cached --quiet || git commit -m "chore: update github stats cards"
          git push
