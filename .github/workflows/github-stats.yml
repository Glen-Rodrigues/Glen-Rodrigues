name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-stats.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'SCRIPT' > generate.mjs
          import https from 'https';
          import fs from 'fs';

          const username = 'Glen-Rodrigues';
          const bg = '#1a1b27', border = '#414868', titleCol = '#70a5fd', text = '#a9b1d6', accent = '#bf91f3', ringText = '#c0caf5', ringTrack = '#2f3350';

          function gql(query) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({ query });
              const req = https.request({
                hostname: 'api.github.com',
                path: '/graphql',
                method: 'POST',
                headers: {
                  'Authorization': `bearer ${process.env.GH_TOKEN}`,
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'User-Agent': 'stats-action'
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(d)); }
                  catch(e) { reject(new Error('JSON parse failed: ' + d.slice(0,200))); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          const result = await gql(`{
            user(login: "${username}") {
              repositories(ownerAffiliations: OWNER, isFork: false, first: 100) {
                nodes { stargazerCount primaryLanguage { name } }
              }
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalRepositoriesWithContributedCommits
              }
              followers { totalCount }
            }
          }`);

          if (result.errors) throw new Error(JSON.stringify(result.errors));

          const u = result.data.user;
          const repos = u.repositories.nodes;
          const stars = repos.reduce((s, r) => s + r.stargazerCount, 0);
          const commits = u.contributionsCollection.totalCommitContributions;
          const prs = u.contributionsCollection.totalPullRequestContributions;
          const issues = u.contributionsCollection.totalIssueContributions;
          const contribTo = u.contributionsCollection.totalRepositoriesWithContributedCommits;
          const followers = u.followers.totalCount;

          // Simple grade heuristic from activity + reach
          const score = commits + prs*5 + issues*2 + stars*10 + followers*3 + contribTo*4;
          const grades = [[600,'S'],[400,'A+'],[250,'A'],[120,'A-'],[60,'B+'],[25,'B'],[0,'B-']];
          const grade = (grades.find(g => score >= g[0]) || [0,'B-'])[1];
          const circ = 301.6;
          const offset = Math.max(20, circ * (1 - Math.min(score/600, 1)));

          // Stats card
          const statsSVG = `<?xml version="1.0" encoding="UTF-8"?>
          <svg width="495" height="220" viewBox="0 0 495 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${titleCol}"/>
                <stop offset="100%" stop-color="${accent}"/>
              </linearGradient>
            </defs>
            <rect x="0.5" y="0.5" width="494" height="219" rx="12" fill="${bg}" stroke="${border}"/>
            <text x="25" y="35" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="${titleCol}">&#x1F4CA; Glen's GitHub Stats</text>
            <line x1="25" y1="45" x2="470" y2="45" stroke="${border}" stroke-width="1"/>
            <text x="25" y="72" font-family="Segoe UI,sans-serif" font-size="13" fill="${text}">&#11088; Total Stars Earned</text>
            <text x="315" y="72" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="${accent}" text-anchor="end">${stars}</text>
            <text x="25" y="97" font-family="Segoe UI,sans-serif" font-size="13" fill="${text}">&#x1F4BB; Total Commits (this year)</text>
            <text x="315" y="97" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="${accent}" text-anchor="end">${commits}</text>
            <text x="25" y="122" font-family="Segoe UI,sans-serif" font-size="13" fill="${text}">&#x1F500; Total Pull Requests</text>
            <text x="315" y="122" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="${accent}" text-anchor="end">${prs}</text>
            <text x="25" y="147" font-family="Segoe UI,sans-serif" font-size="13" fill="${text}">&#x1F41B; Total Issues</text>
            <text x="315" y="147" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="${accent}" text-anchor="end">${issues}</text>
            <text x="25" y="172" font-family="Segoe UI,sans-serif" font-size="13" fill="${text}">&#x1F91D; Contributed To (last year)</text>
            <text x="315" y="172" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="${accent}" text-anchor="end">${contribTo}</text>
            <text x="25" y="197" font-family="Segoe UI,sans-serif" font-size="13" fill="${text}">&#x1F465; Followers</text>
            <text x="315" y="197" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="${accent}" text-anchor="end">${followers}</text>
            <circle cx="405" cy="130" r="48" fill="none" stroke="${ringTrack}" stroke-width="8"/>
            <circle cx="405" cy="130" r="48" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 405 130)"/>
            <text x="405" y="126" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700" fill="${ringText}" text-anchor="middle">${grade}</text>
            <text x="405" y="146" font-family="Segoe UI,sans-serif" font-size="11" fill="${text}" text-anchor="middle">Rank</text>
          </svg>`;

          fs.writeFileSync('github-stats.svg', statsSVG.trim());
          console.log('✅ github-stats.svg written, stars=' + stars + ' commits=' + commits);

          // Language stats
          const langColors = {
            'Python':'#3572A5','JavaScript':'#f1e05a','C':'#555555','TypeScript':'#2b7489',
            'Java':'#b07219','C++':'#f34b7d','HTML':'#e34c26','CSS':'#563d7c','Shell':'#89e051'
          };
          const langMap = {};
          repos.forEach(r => { if (r.primaryLanguage) langMap[r.primaryLanguage.name] = (langMap[r.primaryLanguage.name]||0)+1; });
          const total = Object.values(langMap).reduce((a,b)=>a+b,0)||1;
          const topLangs = Object.entries(langMap).sort((a,b)=>b[1]-a[1]).slice(0,5)
            .map(([name,count]) => ({ name, pct: Math.round(count/total*100), color: langColors[name]||'#8b8b8b' }));

          const barW = 445;
          let xOff = 25;
          const bars = topLangs.map(l => {
            const w = Math.max(2, Math.round(l.pct/100*barW));
            const r = `<rect x="${xOff}" y="88" width="${w}" height="8" rx="4" fill="${l.color}"/>`;
            xOff += w + 2;
            return r;
          }).join('\n  ');

          const legend = topLangs.map((l,i) => {
            const lx = 25 + (i%2)*230, ly = 115 + Math.floor(i/2)*22;
            return `<circle cx="${lx+6}" cy="${ly-5}" r="6" fill="${l.color}"/><text x="${lx+18}" y="${ly}" font-family="Segoe UI,sans-serif" font-size="12" fill="${text}">${l.name} <tspan font-weight="600" fill="${titleCol}">${l.pct}%</tspan></text>`;
          }).join('\n  ');

          const h = 115 + Math.ceil(topLangs.length/2)*22 + 15;
          const langsSVG = `<?xml version="1.0" encoding="UTF-8"?>
          <svg width="495" height="${h}" viewBox="0 0 495 ${h}" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="494" height="${h-1}" rx="12" fill="${bg}" stroke="${border}"/>
            <text x="25" y="35" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="${titleCol}">&#x1F4AC; Most Used Languages</text>
            <line x1="25" y1="45" x2="470" y2="45" stroke="${border}" stroke-width="1"/>
            <text x="25" y="75" font-family="Segoe UI,sans-serif" font-size="12" fill="${text}">Based on public repository count</text>
            ${bars}
            ${legend}
          </svg>`;

          fs.writeFileSync('github-langs.svg', langsSVG.trim());
          console.log('✅ github-langs.svg written, langs=' + topLangs.map(l=>l.name).join(','));
          SCRIPT
          node generate.mjs

      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-langs.svg
          git diff --cached --quiet || git commit -m "chore: update github stats cards"
          git push
